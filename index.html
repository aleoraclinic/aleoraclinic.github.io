<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Alèora Clinic - estética avançada, tecnologia e cuidado personalizado em Taboão da Serra."
    />
    <meta name="theme-color" content="#2e1e26" />
    <meta property="og:title" content="Alèora Clinic" />
    <meta
      property="og:description"
      content="Sua melhor versão começa aqui."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="assets/aleora-symbol.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Open+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Alèora Clinic</title>
  </head>
  <body>
    <main class="page-shell">
      <header class="hero" aria-labelledby="page-title">
        <div class="brand-lockup">
          <img
            class="brand-logo"
            src="assets/aleora-logo.png"
            alt="Alèora Clinic"
            width="647"
            height="167"
          />
        </div>
        <p class="brand-category">ESTÉTICA AVANÇADA</p>
        <span class="brand-divider" aria-hidden="true"></span>
        <h1 id="page-title">Sua melhor versão começa aqui.</h1>
      </header>

      <section class="actions" aria-labelledby="actions-title">
        <div class="section-heading">
          <p class="section-kicker">ALÈORA CLINIC</p>
          <h2 id="actions-title">Escolha como começar</h2>
        </div>

        <div id="link-list" class="link-list" aria-live="polite"></div>

        <noscript>
          <p class="noscript-message">
            Para acessar os canais de atendimento, habilite o JavaScript ou fale diretamente pelo WhatsApp:
            +55 11 93903-9004.
          </p>
        </noscript>
      </section>

      <footer class="footer">
        <div id="social-links" class="social-links"></div>
        <img
          class="footer-symbol"
              src="assets/aleora-symbol.png"
          alt=""
          width="167"
          height="167"
          aria-hidden="true"
        />
        <p class="professional-note">
          A indicação dos procedimentos e protocolos depende de avaliação profissional individualizada.
        </p>
      </footer>
    </main>

    <script src="config.js?v=20260810-2"></script>
    <script src="script.js?v=20260802-2"></script>
  </body>
</html>
